<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Level-Up Gamer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header>
        <nav class="navegacion">
            <div class="navegacion-contenedor">
                <a href="index.html" class="navegacion-logo">
                    <img src="assets/img/Level-Up-Logo.png" alt="Level-Up Gamer">
                    <span>Level-Up Gamer</span>
                </a>
                <ul class="navegacion-enlaces" id="menu-enlaces">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="productos.html" class="activo">Productos</a></li>
                    <li><a href="registro.html">Registrarse</a></li>
                    <li><a href="perfil.html">Mi Perfil</a></li>
                </ul>
                <a href="carrito.html" class="navegacion-carrito">
                    🛒 <span id="contador-carrito" class="badge-carrito">0</span>
                </a>
                <button class="navegacion-hamburger" id="boton-hamburger" onclick="toggleMenu()">&#9776;</button>
            </div>
        </nav>
    </header>

    <main>
        <section class="seccion-productos">
            <div class="container">
                <h1 class="titulo-seccion">Catalogo de Productos</h1>

                <div class="filtros-container">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <div class="filtro-grupo">
                                <label class="filtro-label">Buscar por nombre:</label>
                                <input type="text" id="busqueda-nombre" class="filtro-input" placeholder="Escribe el nombre del producto..." oninput="filtrarProductos()">
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <div class="filtro-grupo">
                                <label class="filtro-label">Categoria:</label>
                                <select id="filtro-categoria" class="filtro-select" onchange="filtrarProductos()">
                                    <option value="todos">Todas</option>
                                    <option value="juegos">Juegos de Mesa</option>
                                    <option value="accesorios">Accesorios</option>
                                    <option value="consolas">Consolas</option>
                                    <option value="computadores">Computadores</option>
                                    <option value="sillas">Sillas Gamers</option>
                                    <option value="mouse">Mouse</option>
                                    <option value="mousepad">Mousepad</option>
                                    <option value="poleras">Poleras</option>
                                    <option value="polerones">Polerones</option>
                                    <option value="servicio-tecnico">Servicio Tecnico</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row" id="lista-productos"></div>
            </div>
        </section>
    </main>

    <footer class="pie-pagina">
        <div class="pie-pagina-contenedor">
            <div>
                <h5 class="pie-pagina-titulo">Level-Up Gamer</h5>
                <p class="pie-pagina-texto">Tu tienda online de videojuegos en Chile.</p>
            </div>
            <div>
                <h5 class="pie-pagina-titulo">Contacto</h5>
                <p class="pie-pagina-correo">contacto@levelupgamer.cl</p>
                <p class="pie-pagina-telefono">+56 9 1234 5678</p>
            </div>
        </div>
        <div class="pie-pagina-copy">
            &copy; 2026 Level-Up Gamer. Todos los derechos reservados.
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
</body>
</html>
